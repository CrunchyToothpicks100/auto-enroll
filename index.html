<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Virtual Advisor</title>
    <link href="styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Title and info -->
    <div class="title-info">
        <h1>Virtual <span class="hollow">Advisor</span></h1>
        <p style="color: #757575">
            Generate potential course schedules catered to
            your degree for the Spring 2026 semester
        </p>
    </div>

    <!-- Degree Info Form -->
    <div class="degree-info">
        <form>
            <label for="major">Major</label>
            <select id="major" name="major">
                <option value="cis-it">CIS - Info Tech (BS)</option>
            </select>

            <label for="taken">Classes taken (or in-progress)</label>
            <input name="taken" id="search" type="text" placeholder="Type course number...">
            <ul id="suggestions"></ul>
            <button id="get-schedule">Get Schedule</button>
        </form>
    </div>
</body>

</html>
